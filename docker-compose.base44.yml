services:
  web:
    image: oven/bun:1.2
    working_dir: /app
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:5173"
    env_file:
      - ./.env
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=5173
      # Vite >= 6.1 appends this to allowedHosts so the preview origin is accepted
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    command: sh -c "bun install && bun run dev -- --host 0.0.0.0 --port 5173"
    restart: unless-stopped

volumes:
  node_modules:
